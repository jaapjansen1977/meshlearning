[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshlearning"
version = "0.1.0"
description = "Auditable synthetic full-body motion reference prototype"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5"]

[project.scripts]
meshlearning = "meshlearning.cli:main"

[tool.setuptools.packages.find]
include = ["meshlearning*"]

[project.optional-dependencies]
review = ["Pillow==12.3.0", "matplotlib==3.10.8"]
bridge = ["usd-core==25.11"]
